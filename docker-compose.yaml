version: 1.0

networks:
  app_network:
    driver: bridge
  

services:

  app:       
    build:
      context: .            ← корень проекта как контекст сборки
      dockerfile: dockerfiles/app.Dockerfile
    ports: 8000:8080
    volumes: ./ → /var/www             (код виден контейнеру, правки без пересборки)
    environment: DB_HOST / DB_NAME / DB_USER / DB_PASSWORD / DB_ROOT_PASSWORD
    depends_on: mysql
    networks, restart: unless-stopped

  mysql:                  
    image: mysql:8.0
    ports: 3316 → 3306
    environment: DB_HOST / DB_NAME / DB_USER / DB_PASSWORD / DB_ROOT_PASSWORD
    volumes:
      - именованный volume → /var/lib/mysql          (данные переживают down)
      - ./scripts/init.sql → /docker-entrypoint-initdb.d/init.sql:ro
        ← сработает ТОЛЬКО на пустом volume
    healthcheck: mysqladmin ping   ← ради него app и умеет ждать
    networks, restart

  phpmyadmin:
    image: phpmyadmin:latest
    ports: 1500 → 80
    environment: PMA_HOST = имя сервиса mysql
    depends_on: mysql
    networks

  composer:                 ← ИНСТРУМЕНТ, не демон
    build: dockerfiles/composer.Dockerfile
    volumes: ./ → /var/www  ← без него vendor/ исчезнет вместе с контейнером
    profiles: [tools]       ← чтобы НЕ поднимался при обычном `up`
    networks — не обязателен (в сеть ему не надо)
    restart — НЕ ставить

volumes:
  db_data:                  ← именованный том для данных MySQL